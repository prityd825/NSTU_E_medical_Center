<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}NSTU E-Medical Center{% endblock %}</title>
  <link rel="icon" href="{% static 'images/favicon.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/emedical.css' %}" rel="stylesheet">
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // data-confirm="Message"  -> ask before following a link / pressing a button.
    // data-method="post"       -> send the link as a POST (with CSRF token) instead of a GET.
    document.addEventListener('click', function (e) {
      var el = e.target.closest('[data-confirm], a[data-method="post"]');
      if (!el) return;
      if (el.hasAttribute('data-confirm') && !window.confirm(el.getAttribute('data-confirm'))) {
        e.preventDefault(); return;
      }
      if (el.matches('a[data-method="post"]')) {
        e.preventDefault();
        var form = document.createElement('form');
        form.method = 'post';
        form.action = el.getAttribute('href');
        var token = document.createElement('input');
        token.type = 'hidden'; token.name = 'csrfmiddlewaretoken';
        token.value = document.querySelector('meta[name="csrf-token"]').content;
        form.appendChild(token);
        document.body.appendChild(form);
        form.submit();
      }
    });
    // Instant table search: <input data-table-filter="#tableId"> hides rows that don't match.
    document.querySelectorAll('[data-table-filter]').forEach(function (input) {
      var table = document.querySelector(input.getAttribute('data-table-filter'));
      if (!table) return;
      input.addEventListener('input', function () {
        var q = input.value.trim().toLowerCase();
        table.querySelectorAll('tbody tr').forEach(function (row) {
          row.style.display = row.textContent.toLowerCase().indexOf(q) === -1 ? 'none' : '';
        });
      });
    });
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
