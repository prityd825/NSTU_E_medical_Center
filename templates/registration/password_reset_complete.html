{% extends 'hospital/homebase.html' %}
{% block title %}Password changed · NSTU E-Medical{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card status-card">
    <div class="stat-icon tone-success"><i class="bi bi-check2-circle"></i></div>
    <h1 class="h3">Password changed</h1>
    <p class="text-muted mb-4">Your password has been updated. You can now sign in with your new password.</p>
    <div class="d-flex justify-content-center flex-wrap gap-2">
      <a href="/patientlogin" class="btn btn-primary">Patient sign in</a>
      <a href="/doctorlogin" class="btn btn-soft">Doctor sign in</a>
    </div>
  </div>
</div>
{% endblock content %}
